[project]
name = "supportops-agent"
version = "0.1.0"
description = "CloudDesk synthetic support demo — Day 1 foundation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.159.1", "pydantic==2.14.1", "uvicorn==0.54.0", "openai==3.42.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
