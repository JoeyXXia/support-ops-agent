name: Offline quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python scripts/check_offline.py
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run format:check
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: supportops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://supportops:test-only@127.0.0.1:5432/supportops_test
      OPENAI_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests/integration -v
