name: Offline quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements.lock
      - name: Deterministic behavior scoring and read-only tool scope
        run: >-
          python -m unittest discover -s tests -v
          -k test_behavior_scoring -k test_tenant_denial_matches_unknown
      - name: Full offline regression
        run: python scripts/check_offline.py
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run format:check
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: supportops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://supportops:test-only@127.0.0.1:5432/supportops_test
      OPENAI_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Actor and tenant isolation, approval binding and ticket idempotency
        run: >-
          python -m unittest discover -s tests/integration -v
          -k test_session_isolation -k test_approvals -k test_idempotency
      - name: Full PostgreSQL regression
        run: python -m unittest discover -s tests/integration -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build --wait --wait-timeout 120
      - run: npm --prefix apps/web run test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
