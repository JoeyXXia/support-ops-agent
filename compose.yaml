services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: local-compose-db
      POSTGRES_DB: supportops
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "supportops", "-d", "supportops"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://supportops:local-compose-db@db:5432/supportops
      SUPPORTOPS_PERSIST_RUNS: "1"
      SUPPORTOPS_DEMO_PASSWORDS: '{"user-alpha":"local-alpha-demo","user-beta":"local-beta-demo","support-alpha":"local-alpha-support","support-beta":"local-beta-support"}'
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        alembic upgrade head
        python -m scripts.seed_demo
        exec uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${SUPPORTOPS_DEMO_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
